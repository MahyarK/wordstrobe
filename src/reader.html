<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wordstrobe</title>
    <link rel="stylesheet" href="./reader.css" />
  </head>
  <body>
    <main id="app" data-state="loading" data-view="rsvp" data-tauri-drag-region="deep">
      <div class="cluster">
        <button id="btn-speak" type="button" tabindex="-1" title="Read aloud (S)" aria-label="Read aloud" aria-pressed="false">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2.5 6h2.2L8 3.2v9.6L4.7 10H2.5z" />
            <path d="M10.6 5.6a3.4 3.4 0 0 1 0 4.8M12.4 3.8a6 6 0 0 1 0 8.4" />
          </svg>
        </button>
        <button id="btn-settings" type="button" tabindex="-1" title="Settings (&#8984;,)" aria-label="Settings">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <path d="M2.5 5h1.8M7.7 5h5.8M2.5 11h6.3M12.2 11h1.3" />
            <circle cx="6" cy="5" r="1.7" />
            <circle cx="10.5" cy="11" r="1.7" />
          </svg>
        </button>
        <button id="btn-close" type="button" tabindex="-1" title="Close (Esc)" aria-label="Close">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <path d="M4 4l8 8M12 4l-8 8" />
          </svg>
        </button>
      </div>

      <section id="stage" data-tauri-drag-region="false">
        <div id="shimmer" aria-hidden="true"><i></i><i></i><i></i></div>
        <div id="word" aria-hidden="true">
          <i class="tick top"></i>
          <span class="l"></span><b class="pivot"></b><span class="r"></span>
          <i class="tick bottom"></i>
        </div>
        <div id="chunk" aria-hidden="true"></div>
        <p id="context"></p>
        <i id="dot" aria-hidden="true"></i>
        <p id="message" role="status"></p>
        <div id="done">
          <p id="summary"></p>
          <div class="actions">
            <button id="replay" type="button" tabindex="-1">Replay</button>
            <button id="copy" type="button" tabindex="-1">Copy</button>
            <button id="textview" type="button" tabindex="-1">Text view</button>
          </div>
        </div>
      </section>

      <div id="text" data-tauri-drag-region="false"></div>

      <footer>
        <div class="line">
          <span id="stats"></span>
          <span id="toast" role="status"></span>
        </div>
        <div id="bar"><i></i></div>
      </footer>
    </main>
    <script type="module" src="./reader.ts"></script>
  </body>
</html>
