[package]
name = "wordstrobe"
version = "0.1.0"
description = "Read any text on your screen, one word at a time"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSResponder", "NSWindow"] }

# Windows and Linux X11 region capture: the freeze-frame overlay (src-tauri/src/overlay.rs).
[target.'cfg(not(target_os = "macos"))'.dependencies]
xcap = "0.9"

[target.'cfg(windows)'.dependencies]
# Windows.Media.Ocr (src/platform/windows.rs).
windows = { version = "0.62", features = [
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_System_Com",
  "Win32_System_WinRT",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Wayland region capture: the Screenshot portal (the desktop's own picker). Tokio, as Tauri's runtime.
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screenshot"] }
