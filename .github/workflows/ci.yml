name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # Pinned instead of macos-latest, which moves between macOS versions on GitHub's schedule. The OCR
    # helper uses RecognizeDocumentsRequest: it needs the macOS 26 SDK (Xcode 26+) to compile, and
    # `--selftest` only exercises that production path when it also runs on macOS 26 (on macOS 15 it skips it).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # Xcode 26+ (macOS 26 SDK) for the helper, see above.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: scripts/build-helper.sh
      - run: src-tauri/binaries/wordstrobe-ocr-*-apple-darwin --selftest
      # Tauri's build script embeds ../dist, so the frontend has to exist before clippy.
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages (Tauri, Tesseract, headless X)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf tesseract-ocr tesseract-ocr-eng xvfb dbus-x11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # The real app under Xvfb: --read-image (debug builds) skips the capture and runs Tesseract + the reader.
      - name: End to end
        run: |
          npx tauri build --debug --no-bundle
          dbus-run-session -- xvfb-run -a src-tauri/target/debug/wordstrobe --read-image src-tauri/tests/fixtures/ocr-en.png > e2e.log 2>&1 &
          for i in $(seq 1 90); do grep -q "reader:load" e2e.log && break; sleep 1; done
          cat e2e.log
          pkill -f target/debug/wordstrobe || true
          grep -q "emitted reader:load" e2e.log

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # Windows.Media.Ocr needs an OCR language; server images may not have one.
      - name: OCR language (en-US)
        shell: pwsh
        run: |
          $cap = Get-WindowsCapability -Online | Where-Object Name -like "Language.OCR~~~en-US*"
          $cap | Format-Table Name, State
          if ($cap.State -ne "Installed") { Add-WindowsCapability -Online -Name $cap.Name | Out-Null }
      - run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          WORDSTROBE_REQUIRE_OCR: "1" # the OCR test fails instead of skipping without an engine
      - name: End to end
        shell: pwsh
        run: |
          npx tauri build --debug --no-bundle
          $app = Start-Process -FilePath src-tauri\target\debug\wordstrobe.exe -PassThru `
            -ArgumentList "--read-image", "src-tauri\tests\fixtures\ocr-en.png" -RedirectStandardError e2e.log
          for ($i = 0; $i -lt 90; $i++) {
            if ((Test-Path e2e.log) -and (Select-String -Path e2e.log -Pattern "reader:load" -Quiet)) { break }
            Start-Sleep 1
          }
          Get-Content e2e.log
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          if (-not (Select-String -Path e2e.log -Pattern "emitted reader:load" -Quiet)) { exit 1 }
