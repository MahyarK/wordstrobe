name: Release

# A v* tag builds every platform and attaches the installers to a draft release, to check and publish by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            args: --target universal-apple-darwin --bundles dmg
          - os: windows-latest
            args: --bundles nsis
          # 24.04, not older: xcap's PipeWire bindings don't build against 22.04's PipeWire 0.3.48. The packages
          # therefore need glibc 2.39+ (Ubuntu 24.04+, Fedora 40+, Debian 13, Arch).
          - os: ubuntu-24.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libdbus-1-dev libclang-dev libpipewire-0.3-dev libgbm-dev libxcb1-dev libxrandr-dev libxcb-randr0-dev libxcb-shm0-dev libx11-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Wordstrobe ${{ github.ref_name }}
          releaseBody: See the README for install steps per platform.
          releaseDraft: true
          args: ${{ matrix.args }}
